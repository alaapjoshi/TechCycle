<!doctype html><html><head><meta charset="utf-8"><title>cover-linkedin</title><link rel="stylesheet" href="style.css"><style>
body{width:1200px;height:627px}
.wrap{display:flex;align-items:center;height:100%;padding:64px 64px;gap:40px}
.copy{flex:1}
h1{font-size:72px;font-weight:800;letter-spacing:-1px;margin-bottom:20px}
.pitch{font-size:28px;line-height:1.4;margin-bottom:36px;max-width:540px}
.phones{display:flex;gap:24px;align-items:flex-start}
.phones .phone{width:218px;height:468px;border-radius:30px;padding:10px}
.phones .phone img{border-radius:22px}
.phones .phone.low{margin-top:44px}
.byline{left:64px}
</style></head><body><div class="wrap">
<div class="copy">
  <h1>TechCycle</h1>
  <p class="pitch muted">A mobile marketplace for reusable electronics: browse parts, list your own, and get resale price estimates.</p>
  <div class="chips"><span class="chip">React Native</span><span class="chip">Expo</span><span class="chip">Firebase</span><span class="chip">OpenAI</span></div>
</div>
<div class="phones">
  <div class="phone demo"><img src="shots/demo-home.png" alt="Home screen"></div>
  <div class="phone demo low"><img src="shots/demo-price.png" alt="Price estimate screen"></div>
</div></div>
<div class="byline">Alaap Joshi · Original 2023 demo</div></body></html>
